name: Streamlit AWS CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
  workflow_dispatch:

concurrency:
  group: agentic-chatbot-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================
  # 1. Continuous Integration
  # ============================================
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint code
        run: |
          echo "Linting repository"

      - name: Run unit tests
        run: |
          echo "Running unit tests"

  # ============================================
  # 2. Build and push image to Docker Hub
  # ============================================
  push_to_registry:
    name: Build and Push Docker Image
    needs: integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker image settings
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
        run: |
          if [[ -z "$DOCKER_USERNAME" ]]; then
            echo "Error: DOCKER_USERNAME is not set"
            exit 1
          fi

          if [[ -z "$IMAGE_NAME" ]]; then
            echo "Error: IMAGE_NAME is not set"
            exit 1
          fi

          echo "Docker image settings validated successfully"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:main
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # 3. Deploy to AWS EC2 self-hosted runner
  # ============================================
  continuous-deployment:
    name: Deploy to AWS EC2
    needs: push_to_registry
    runs-on: self-hosted

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Validate application secrets
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          WEATHERAPI_API_KEY: ${{ secrets.WEATHERAPI_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
        run: |
          for var_name in TAVILY_API_KEY WEATHERAPI_API_KEY OPENWEATHER_API_KEY \
                          LANGSMITH_TRACING LANGSMITH_ENDPOINT LANGSMITH_API_KEY LANGSMITH_PROJECT; do
            if [[ -z "${!var_name}" ]]; then
              echo "Error: $var_name is not set"
              exit 1
            fi
          done

          echo "All required secrets are set. Proceeding with deployment."

      - name: Pull latest Docker image
        env:
          IMAGE_PATH: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}
        run: |
          docker pull "${IMAGE_PATH}:main"

      - name: Ensure shared network exists
        run: |
          docker network inspect app-net >/dev/null 2>&1 || docker network create app-net

      - name: Ensure Ollama container is running
        run: |
          if ! docker ps --filter "name=^ollama$" --filter "status=running" --format "{{.Names}}" | grep -q ollama; then
            docker rm -f ollama 2>/dev/null || true
            docker run -d \
              --restart unless-stopped \
              --name ollama \
              --network app-net \
              -v ollama-data:/root/.ollama \
              ollama/ollama
              # add "--gpus all" here if this is a GPU instance with nvidia-container-toolkit installed
          fi

          # make sure the models the app expects are present (no-op if already pulled)
          docker exec ollama ollama pull "${{ vars.OLLAMA_MODEL || 'qwen2.5:7b' }}"
          docker exec ollama ollama pull "${{ vars.OLLAMA_EMBED_MODEL || 'nomic-embed-text' }}"

      - name: Stop and remove existing container
        run: |
          docker rm -f stapp 2>/dev/null || true

      - name: Run Streamlit container
        env:
          IMAGE_PATH: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}

          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          WEATHERAPI_API_KEY: ${{ secrets.WEATHERAPI_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}

          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
        run: |
          docker run -d \
            --restart unless-stopped \
            --name stapp \
            --network app-net \
            -p 8501:8501 \
            -e TAVILY_API_KEY="${TAVILY_API_KEY}" \
            -e WEATHERAPI_API_KEY="${WEATHERAPI_API_KEY}" \
            -e OPENWEATHER_API_KEY="${OPENWEATHER_API_KEY}" \
            -e OLLAMA_BASE_URL="http://ollama:11434" \
            -e LANGSMITH_TRACING="${LANGSMITH_TRACING}" \
            -e LANGSMITH_ENDPOINT="${LANGSMITH_ENDPOINT}" \
            -e LANGSMITH_API_KEY="${LANGSMITH_API_KEY}" \
            -e LANGSMITH_PROJECT="${LANGSMITH_PROJECT}" \
            "${IMAGE_PATH}:main"

      - name: Verify container is running
        run: |
          sleep 10

          if ! docker ps \
            --filter "name=stapp$" \
            --filter "status=running" \
            --format "{{.Names}}" | grep -q stapp; then

            echo "Streamlit container failed to start."
            docker logs stapp || true
            exit 1
          fi

          echo "Streamlit container is running successfully."
          docker ps --filter "name=stapp$"

      - name: Verify Streamlit health endpoint
        run: |
          for i in {1..10}; do
            if docker exec stapp python -c "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health').read()" > /dev/null 2>&1; then
              echo "Streamlit is healthy."
              exit 0
            fi

            echo "Waiting for Streamlit to be ready..."
            sleep 5
          done

          echo "Streamlit did not become healthy."
          docker logs --tail 100 stapp || true
          exit 1

      - name: Show recent application logs
        if: always()
        run: |
          docker logs --tail 50 stapp 2>/dev/null || true

      - name: Remove unused Docker images
        if: always()
        run: |
          docker image prune -f
